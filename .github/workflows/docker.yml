name: Docker Image CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # The secret is passed as an environment variable rather than pasted
      # into the script body. `echo "${{ secrets.X }}"` textually substitutes
      # the secret into the shell command before bash parses it, so any value
      # containing a double quote terminates the string early and the rest of
      # the file is executed as commands. That is not theoretical: the quoted
      # multi-line PROMPT_* templates broke every variable after them, secrets
      # included. Going through `env:` means bash never re-parses the content,
      # and printf avoids echo's backslash handling.
      - name: Build the Docker image
        env:
          APP_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          printf '%s' "$APP_ENV" > ./backEnd/.env
          docker build -t instagram-roast-backend:latest ./backEnd

      - name: Configure GCP Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: roast-123
          export_default_credentials: true

      - name: Configure Docker Client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Push the Docker image (Skip on PR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTIFACT_REGISTRY_URL: asia-south1-docker.pkg.dev/roast-123/instagram-roast-backend
        run: |
          docker tag instagram-roast-backend:latest $ARTIFACT_REGISTRY_URL/instagram-roast-backend:latest
          docker push $ARTIFACT_REGISTRY_URL/instagram-roast-backend:latest

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # The secret is passed as an environment variable rather than pasted
      # into the script body. `echo "${{ secrets.X }}"` textually substitutes
      # the secret into the shell command before bash parses it, so any value
      # containing a double quote terminates the string early and the rest of
      # the file is executed as commands. That is not theoretical: the quoted
      # multi-line PROMPT_* templates broke every variable after them, secrets
      # included. Going through `env:` means bash never re-parses the content,
      # and printf avoids echo's backslash handling.
      - name: Build the Docker image
        env:
          APP_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s' "$APP_ENV" > ./frontEnd/.env
          docker build -t instagram-roast-frontend:latest ./frontEnd

      - name: Configure GCP Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: roast-123
          export_default_credentials: true

      - name: Configure Docker Client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Push the Docker image (Skip on PR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTIFACT_REGISTRY_URL: asia-south1-docker.pkg.dev/roast-123/instagram-roast-frontend
        run: |
          docker tag instagram-roast-frontend:latest $ARTIFACT_REGISTRY_URL/instagram-roast-frontend:latest
          docker push $ARTIFACT_REGISTRY_URL/instagram-roast-frontend:latest


  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref == 'refs/heads/main'
    steps:
      - name: Configure GCP Credentials
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: roast-123
          export_default_credentials: true

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@main
        with:
          service_name: "instagram-roast-backend"
          image: "asia-south1-docker.pkg.dev/roast-123/instagram-roast-backend/instagram-roast-backend:latest"
          platform: "managed"
          region: "asia-east1"
          service: "instagram-roast-backend"
          port: 8080


  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref == 'refs/heads/main'
    steps:
      - name: Configure GCP Credentials
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: roast-123
          export_default_credentials: true

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@main
        with:
          service_name: "instagram-roast-frontend"
          image: "asia-south1-docker.pkg.dev/roast-123/instagram-roast-frontend/instagram-roast-frontend:latest"
          platform: "managed"
          region: "asia-east1"
          service: "instagram-roast-frontend"
          port: 5173
          # server.js reads these at runtime, so they cannot come from the
          # FRONTEND_ENV secret — that file only carries the VITE_ vars, which
          # Vite inlines at build time and which never exist as process.env in
          # the running container. Without API_ORIGIN the server falls back to
          # localhost:8080, every call to the API fails, and both the per-roast
          # link previews and the roast sitemap silently degrade to their
          # generic fallbacks.
          env_vars: |
            API_ORIGIN=https://api.instaroasts.com
            SITE_ORIGIN=https://instaroasts.com
